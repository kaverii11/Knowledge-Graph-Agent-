name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # unit tests only: no API key or database needed (the LLM regression gate is `pytest -m llm`, run locally)
      - run: python -m pytest -q -m "not llm"
