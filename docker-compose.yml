# Local Neo4j for the knowledge graph:  docker compose up -d
# Browser UI: http://localhost:7474  (user neo4j, password from NEO4J_PASSWORD in .env)
services:
  neo4j:
    image: neo4j:5
    container_name: sebi-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
    volumes:
      - sebi_neo4j_data:/data
volumes:
  sebi_neo4j_data:
